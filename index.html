<title>Campeonato de Revisão</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#14181b; --ink-2:#4a555c; --ink-3:#7d888e;
  --ground:#ecefee; --surface:#ffffff; --sunk:#f5f7f6;
  --line:#d5dad9; --line-2:#e6eae9;
  --accent:#0e5c63; --accent-ink:#ffffff; --accent-soft:#dceaea;
  --sev-a:#a3291d; --sev-m:#8a5a00; --sev-b:#4a555c;
  --ok:#1d6b47;
  --radius:6px;
  --font-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --font-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8edeb; --ink-2:#a7b3b4; --ink-3:#7f8c8d;
    --ground:#121718; --surface:#1a2123; --sunk:#151b1d;
    --line:#2c3639; --line-2:#232b2d;
    --accent:#5cbcc2; --accent-ink:#08292c; --accent-soft:#1d3336;
    --sev-a:#e58a7e; --sev-m:#d7a95a; --sev-b:#a7b3b4;
    --ok:#6cc39a;
  }
}
:root[data-theme="dark"]{
  --ink:#e8edeb; --ink-2:#a7b3b4; --ink-3:#7f8c8d;
  --ground:#121718; --surface:#1a2123; --sunk:#151b1d;
  --line:#2c3639; --line-2:#232b2d;
  --accent:#5cbcc2; --accent-ink:#08292c; --accent-soft:#1d3336;
  --sev-a:#e58a7e; --sev-m:#d7a95a; --sev-b:#a7b3b4;
  --ok:#6cc39a;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);line-height:1.55;font-size:15.5px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:18px;padding-block:0 64px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.18rem;font-weight:600;letter-spacing:-.005em}
h3{font-size:.95rem;font-weight:600}
p{margin:.5em 0;max-width:68ch}
a{color:var(--accent);text-underline-offset:2px}
code,.mono{font-family:var(--font-mono);font-size:.92em}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* topo */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-weight:500;font-size:.82rem;background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:4px;white-space:nowrap}
.top .modo{font-family:var(--font-display);font-weight:600;font-size:.95rem}
.top .clock{margin-left:auto;font-family:var(--font-mono);font-size:.82rem;color:var(--ink-3)}

section{margin-top:28px}
.panelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line-2);margin:22px 0}

table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-family:var(--font-display);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.scroll{overflow-x:auto}
ol,ul{padding-left:1.2em;margin:.5em 0}
li{margin:.3em 0}

.rule{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0}
.rule strong{font-family:var(--font-display)}
.note{color:var(--ink-2);font-size:.92rem}

input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;max-width:100%}
textarea{resize:none;overflow:hidden;min-height:56px;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:4px;padding:8px 15px;font-weight:600;font-family:var(--font-display);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.voltar{padding:4px 10px;font-size:.82rem}

pre.prompt{background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius);padding:14px;overflow-x:auto;font-family:var(--font-mono);font-size:.84rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.check li{list-style:none}
.check ul{padding-left:0}
.check label.item{display:flex;gap:9px;font-weight:400;font-size:.93rem;color:var(--ink);margin-bottom:7px;align-items:flex-start}
.check input[type=checkbox]{width:auto;margin-top:4px;accent-color:var(--accent)}
.ck-num{font-family:var(--font-mono);color:var(--ink-3);font-size:.85em}

.status{font-size:.85rem;color:var(--ink-3);font-family:var(--font-mono)}
.status.ok{color:var(--ok)}
.status.err{color:var(--sev-a)}
.sev-A{color:var(--sev-a);font-weight:600}
.sev-M{color:var(--sev-m);font-weight:600}
.sev-B{color:var(--sev-b)}
.num{font-variant-numeric:tabular-nums}

.qrsheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.qrcell{border:1px dashed var(--line);border-radius:var(--radius);padding:14px;text-align:center;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.qrbox{display:flex;justify-content:center;align-items:center;width:100%}
.qrcell canvas,.qrcell img{display:block;margin:0 auto;max-width:100%;height:auto;background:#fff;padding:6px;border-radius:4px}
.qrcell .g{font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.qrcell .u{font-family:var(--font-mono);font-size:.62rem;color:var(--ink-3);word-break:break-all;margin-top:6px}


/* larguras da tabela de defeitos — a descrição precisa caber sem scroll */
#tabDefeitos{min-width:700px;table-layout:fixed}
#tabDefeitos .c-id{width:52px}
#tabDefeitos .c-arq{width:150px}
#tabDefeitos .c-tipo{width:84px}
#tabDefeitos .c-sev{width:72px}
#tabDefeitos .c-desc{width:auto;min-width:240px}
#tabDefeitos .c-quem{width:110px}
#tabDefeitos .c-orig{width:82px}
#tabDefeitos textarea{min-height:82px}
#ataBloco textarea{min-height:68px}

/* celular: tabela vira ficha, uma linha por bloco */
@media (max-width:900px){
  body{font-size:16px}
  .wrap{padding-inline:14px}
  h1{font-size:1.55rem}
  .top-in{padding:8px 14px;gap:8px}
  .top .clock{margin-left:0;flex-basis:100%}
  .scroll.stack{overflow-x:visible}
  table.stack{min-width:0!important;display:block}
  table.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border:1px solid var(--line);border-radius:var(--radius);background:var(--sunk);padding:12px;margin-bottom:12px}
  table.stack td{border:none;padding:5px 0}
  table.stack td::before{content:attr(data-rot);display:block;font-family:var(--font-display);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:3px}
  table.stack td.c-id::before{display:none}
  table.stack td.c-id{font-weight:700;color:var(--accent)}
  #tabDefeitos .c-desc,#tabDefeitos .c-arq,#tabDefeitos .c-tipo,#tabDefeitos .c-sev,#tabDefeitos .c-quem,#tabDefeitos .c-orig{width:auto;min-width:0}
  .btn{width:100%;text-align:center}
  .voltar{width:auto;flex:0 0 auto}
  .row .status{width:100%}
  pre.prompt{font-size:.8rem}
}

@media print{
  @page{size:A4 portrait;margin:8mm}
  .top,.noprint{display:none!important}
  .folhaqr{margin:0}
  .qrsheet{grid-template-columns:repeat(2,1fr);gap:4mm}
  .qrcell{padding:5mm 4mm;min-height:62mm;justify-content:center;break-inside:avoid;page-break-inside:avoid}
  .qrcell canvas,.qrcell img{width:34mm;height:34mm;padding:2mm}
  .qrcell .g{font-size:13pt}
  .qrcell .note{font-size:7pt;margin-bottom:2mm!important}
  .qrcell .u{font-size:5.5pt;margin-top:2mm}
  body.so-ata #app > section:not(#ataBloco){display:none!important}
  body.so-ata .row{display:none!important}
  input,select,textarea{border:none;border-bottom:1px solid #999;background:none;padding:2px 0}
  body{background:#fff;color:#000;font-size:11pt}
  .panelcard{border:none;padding:0}
  .qrcell{border:1px dashed #999;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

<script>
"use strict";

/* ---------- utilidades ---------- */

const $ = (sel, el) => (el || document).querySelector(sel);
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function agora(){
  const d = new Date();
  return d.toTimeString().slice(0,5);
}
function tabela(cabecalhos, linhas, empilhavel){
  const cls = empilhavel ? " stack" : "";
  return '<div class="scroll' + cls + '"><table class="' + (empilhavel ? "stack" : "") + '"><thead><tr>' +
    cabecalhos.map(h => "<th>" + h + "</th>").join("") +
    "</tr></thead><tbody>" +
    linhas.map(l => "<tr>" + l.map((c, i) =>
      '<td data-rot="' + cabecalhos[i].replace(/<[^>]+>/g, "") + '">' + c + "</td>").join("") + "</tr>").join("") +
    "</tbody></table></div>";
}

/* ---------- blocos de conteúdo ---------- */

function blocoCartao(modoId){
  const m = MODOS[modoId];
  let h = '<section class="panelcard">';
  h += '<div class="sec-head"><span class="eyebrow">Cartão de modo · ' + esc(modoId) + '</span></div>';
  h += "<h2>" + esc(m.nome) + "</h2>";
  h += '<p class="note">' + m.sub + "</p>";
  h += "<h3 style=\"margin-top:18px\">Papéis</h3>";
  h += tabela(["Papel","Quantos","O que faz"], m.papeis.map(p => [ "<strong>" + p[0] + "</strong>", p[1], p[2] ]), true);
  h += "<h3 style=\"margin-top:18px\">Procedimento</h3><ol>" + m.proc.map(p => "<li>" + p + "</li>").join("") + "</ol>";
  if (m.restricoes.length){
    h += "<h3>Restrições</h3><ul>" + m.restricoes.map(p => "<li>" + p + "</li>").join("") + "</ul>";
  }
  if (m.regra){
    h += '<div class="rule"><strong>Regra de ouro.</strong> ' + m.regra + "</div>";
  }
  if (m.menor){
    h += '<p class="note"><strong>Se faltar gente hoje:</strong> ' + m.menor + "</p>";
  }
  h += '<p class="note" style="margin-top:14px">⏱ <strong>20 minutos.</strong> O cronômetro é público — quando fechar 20 min, parem, mesmo no meio de um achado.</p>';
  return h + "</section>";
}

function blocoChecklist(){
  let h = '<section class="panelcard check">';
  h += '<div class="sec-head"><span class="eyebrow">Material do seu grupo</span></div>';
  h += "<h2>Checklist de Revisão — Equipe SIGA</h2>";
  h += '<p class="note">Checklist genérico da equipe: ele não aponta os defeitos, ele orienta o olhar. O Leitor conduz item a item.</p>';
  CHECKLIST.forEach(([titulo, dono, itens], si) => {
    h += '<h3 style="margin-top:20px">' + esc(titulo) + ' <span class="note" style="font-weight:400">(' + esc(dono) + ")</span></h3><ul>";
    itens.forEach(([num, txt], ii) => {
      const id = "ck-" + si + "-" + ii;
      h += '<li><label class="item" for="' + id + '"><input type="checkbox" id="' + id + '">' +
           '<span><span class="ck-num">' + num + "</span> " + txt + "</span></label></li>";
    });
    h += "</ul>";
  });
  h += '<div class="rule"><strong>Regras de uso.</strong><ol style="margin:.4em 0 0">' +
       CHECKLIST_REGRAS.map(r => "<li>" + r + "</li>").join("") + "</ol></div>";
  return h + "</section>";
}

function blocoPrompt(qual){
  const texto = qual === "A" ? PROMPT_A : PROMPT_B;
  let h = '<section class="panelcard">';
  h += '<div class="sec-head"><span class="eyebrow">Material do seu grupo</span></div>';
  h += "<h2>PROMPT " + qual + "</h2>";
  h += '<p class="note">Use qualquer assistente disponível (Claude, ChatGPT, Gemini, Copilot Chat). <strong>Cole o prompt exatamente como está</strong>, sem melhorar. Os trechos entre <code>&lt; &gt;</code> vocês substituem pelo conteúdo real dos arquivos do PR.</p>';
  h += '<div class="row" style="margin:12px 0"><button class="btn" id="copiarPrompt">Copiar prompt</button>' +
       '<span class="status" id="copiaStatus"></span></div>';
  h += '<pre class="prompt" id="promptTexto">' + esc(texto) + "</pre>";
  return h + "</section>";
}

function blocoLinks(){
  return '<section class="panelcard">' +
    '<div class="sec-head"><span class="eyebrow">Artefatos sob revisão</span></div>' +
    '<p class="note">Não é preciso ter conta no GitHub — vocês só vão ler.</p>' +
    tabela(["Onde","O que é"], [
      ['<a href="' + PR_URL + '" target="_blank" rel="noopener"><strong>PR #1 → Files changed</strong></a>',
       "O diff sob revisão: <code>matricula.py</code> e <code>test_matricula.py</code>"],

       "Padrão de codificação da equipe"]

    '<div class="rule"><strong>As duas regras que protegem o exercício.</strong> Ninguém comenta no GitHub — os achados vão para a ata. E nada de linter, análise estática ou IA, exceto quem recebeu o cartão de IA.</div>' +
    "</section>";
}

/* ---------- ata ---------- */

const TIPOS = ["", "REQ", "LOG", "SEG", "TST", "MAN"];

    '<td class="mono num c-id" data-rot="ID">' + id + "</td>" +
    '<td class="c-arq" data-rot="Arquivo / linha"><input id="def-arq-' + i + '" placeholder="matricula.py:81" aria-label="Arquivo e linha do defeito ' + id + '"></td>' +

  h += "<h3 style=\"margin-top:22px\">2 · Papéis</h3>";
  h += '<p class="note">Os papéis já vêm do cartão do seu modo. Se faltou gente, ajuste segundo a regra do cartão.</p>';
  h += tabela(["Papel","Integrante"], cfg.papeis.map((p, i) =>
    ['<input id="pap-papel-' + i + '" value="' + esc(p) + '" aria-label="Papel ' + (i+1) + '">',
     '<input id="pap-nome-' + i + '" placeholder="nome" aria-label="Integrante no papel ' + (i+1) + '">']), true);

  h += "<h3 style=\"margin-top:22px\">3 · Registro de defeitos</h3>";
  h += '<p class="note"><strong>Severidade:</strong> A = impede o merge · M = comportamento errado em caso específico · B = qualidade, legibilidade. ' +
       "<strong>Tipo:</strong> REQ requisito · LOG lógica · SEG segurança · TST teste · MAN manutenibilidade." +
       (temIA ? " <strong>Origem:</strong> H humano · IA sugerido pela IA e confirmado." : "") +
       " <strong>Achado sem localização não conta.</strong></p>";
  const cab = ["ID","Arquivo / linha","Tipo","Sev.","Descrição","Quem achou"].concat(temIA ? ["Origem"] : []);
  h += '<div class="scroll stack"><table id="tabDefeitos" class="stack"><thead><tr>' + cab.map(c => "<th>" + c + "</th>").join("") +
       '</tr></thead><tbody id="corpoDefeitos"></tbody></table></div>';
  h += '<div class="row" style="margin-top:10px"><button class="btn ghost" id="maisDefeito" type="button">+ adicionar linha</button></div>';

  h += "<h3 style=\"margin-top:22px\">4 · Achados descartados (falsos positivos)</h3>";
  h += '<p class="note">Metralhar não vence o campeonato: falso positivo custa no quadro final.</p>';
  h += '<div class="scroll stack"><table class="stack"><thead><tr><th>Achado levantado</th><th>Por que foi descartado</th></tr></thead><tbody id="corpoFP"></tbody></table></div>';
  h += '<div class="row" style="margin-top:10px"><button class="btn ghost" id="maisFP" type="button">+ adicionar linha</button></div>';

  h += "<h3 style=\"margin-top:22px\">5 · Números para o quadro comparativo</h3>";
  h += '<div class="scroll"><table><tbody>' +
    '<tr><td>Total de achados registrados</td><td class="mono num" id="n-achados">0</td></tr>' +
    '<tr><td>Achados descartados como falsos positivos</td><td class="mono num" id="n-fp">0</td></tr>' +
    '<tr><td>Tempo efetivo de revisão</td><td class="mono num" id="n-tempo">—</td></tr>' +
    '<tr><td>Linhas revisadas por minuto (≈150 ÷ tempo)</td><td class="mono num" id="n-ritmo">—</td></tr>' +
    "</tbody></table></div>";

  h += "<h3 style=\"margin-top:22px\">6 · Decisão da revisão</h3>";
  h += '<div><label for="f-decisao">Decisão</label><select id="f-decisao">' +
    ["", "Aprovado — pode ir para produção",
     "Aprovado com ressalvas — corrigir os itens de severidade B antes do merge",
     "Reprovado / requer nova revisão — há defeitos de severidade A ou M"]
      .map(o => "<option>" + o + "</option>").join("") + "</select></div>";
  h += '<div style="margin-top:10px"><label for="f-justificativa">Justificativa em uma frase</label><textarea id="f-justificativa" rows="2"></textarea></div>';

  h += "<h3 style=\"margin-top:22px\">7 · Reflexão do grupo</h3>";
  h += '<div style="display:grid;gap:12px">' +
    '<div><label for="f-r1">a) O que o nosso modo de revisão pegou bem?</label><textarea id="f-r1" rows="2"></textarea></div>' +
    '<div><label for="f-r2">b) O que ele claramente deixou passar?</label><textarea id="f-r2" rows="2"></textarea></div>' +
    '<div><label for="f-r3">c) O que mudaríamos no processo se tivéssemos mais 20 minutos?</label><textarea id="f-r3" rows="2"></textarea></div>' +
    "</div>";

  h += '<div class="rule"><strong>Como entregar.</strong> ' +
    (FORM_URL
      ? "1. <strong>Gerar a ata em PDF</strong> — abre a caixa de impressão; em <em>Destino</em>, escolham <em>Salvar como PDF</em> e guardem o arquivo. " +
        "2. <strong>Enviar a ata</strong> — abre o formulário da squad com o grupo de vocês já marcado. " +
        "3. Anexem o PDF salvo. O formulário pede <strong>login com a conta institucional</strong>; se pedir para trocar de conta, é essa que vale."
      : "Gerem o PDF e entreguem do jeito que a professora combinar. O botão de copiar serve se ela preferir o texto colado.") +
    "</div>";
  h += '<div class="row" style="margin-top:18px">' +
    '<button class="btn" id="imprimirAta" type="button">Gerar a ata em PDF</button>' +
    (FORM_URL ? '<button class="btn" id="enviarAta" type="button">Enviar a ata</button>' : "") +
    '<button class="btn ghost" id="copiarAta" type="button">Copiar a ata como texto</button>' +
    '<span class="status" id="ataStatus">rascunho guardado neste navegador enquanto vocês digitam</span></div>';
  return h + "</section>";
}

/* ---------- estado da ata ---------- */

let NDEF = 0, NFP = 0, TEM_IA = false, GRUPO = null;

function addDefeito(){
  $("#corpoDefeitos").insertAdjacentHTML("beforeend", linhaDefeito(NDEF, TEM_IA));
  NDEF++;
  const ta = document.getElementById("def-desc-" + (NDEF - 1));
  if (ta) crescer(ta);
}
function addFP(){
  const i = NFP++;
  $("#corpoFP").insertAdjacentHTML("beforeend",
    '<tr><td data-rot="Achado levantado"><input id="fp-achado-' + i + '" aria-label="Achado descartado ' + (i+1) + '"></td>' +
    '<td data-rot="Por que foi descartado"><input id="fp-motivo-' + i + '" placeholder="por que não é defeito" aria-label="Motivo do descarte ' + (i+1) + '"></td></tr>');
}
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ""; }

function crescer(el){
  if (!el || el.tagName !== "TEXTAREA") return;
  el.style.height = "auto";
  el.style.height = (el.scrollHeight + 2) + "px";
}
function crescerTodas(){ app.querySelectorAll("textarea").forEach(crescer); }

function coletarAta(){
  const defeitos = [];
  for (let i = 0; i < NDEF; i++){
    const d = {arquivo: val("def-arq-" + i), tipo: val("def-tipo-" + i), sev: val("def-sev-" + i),
               descricao: val("def-desc-" + i), quem: val("def-quem-" + i), origem: val("def-orig-" + i)};
    if (d.arquivo || d.descricao) defeitos.push(d);
  }
  const fp = [];
  for (let i = 0; i < NFP; i++){
    const f = {achado: val("fp-achado-" + i), motivo: val("fp-motivo-" + i)};
    if (f.achado) fp.push(f);
  }
  const cfg = GRUPOS[GRUPO];
  const papeis = cfg.papeis.map((_, i) => ({papel: val("pap-papel-" + i), nome: val("pap-nome-" + i)}));
  const tempo = Number(val("f-tempo")) || 0;
  return {
    grupo: "G" + GRUPO, modo: cfg.modo, modoNome: MODOS[cfg.modo].nome,
    inicio: val("f-inicio"), fim: val("f-fim"), tempo: tempo,
    papeis: papeis, defeitos: defeitos, falsosPositivos: fp,
    decisao: val("f-decisao"), justificativa: val("f-justificativa"),
    reflexao: {a: val("f-r1"), b: val("f-r2"), c: val("f-r3")},
    totalAchados: defeitos.length, totalDescartados: fp.length,
    ritmo: tempo > 0 ? Math.round(150 / tempo * 10) / 10 : null,
    atualizadoEm: new Date().toISOString()
  };
}

function aplicarAta(a){
  if (!a) return;
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
  set("f-inicio", a.inicio); set("f-fim", a.fim); set("f-tempo", a.tempo || "");
  set("f-decisao", a.decisao); set("f-justificativa", a.justificativa);
  if (a.reflexao){ set("f-r1", a.reflexao.a); set("f-r2", a.reflexao.b); set("f-r3", a.reflexao.c); }
  (a.papeis || []).forEach((p, i) => { set("pap-papel-" + i, p.papel); set("pap-nome-" + i, p.nome); });
  (a.defeitos || []).forEach((d, i) => {
    while (NDEF <= i) addDefeito();
    set("def-arq-" + i, d.arquivo); set("def-tipo-" + i, d.tipo); set("def-sev-" + i, d.sev);
    set("def-desc-" + i, d.descricao); set("def-quem-" + i, d.quem); set("def-orig-" + i, d.origem);
  });
  (a.falsosPositivos || []).forEach((f, i) => {
    while (NFP <= i) addFP();
    set("fp-achado-" + i, f.achado); set("fp-motivo-" + i, f.motivo);
  });
  recalcular();
}

function recalcular(){
  const a = coletarAta();
  $("#n-achados").textContent = a.totalAchados;
  $("#n-fp").textContent = a.totalDescartados;
  $("#n-tempo").textContent = a.tempo ? a.tempo + " min" : "—";
  $("#n-ritmo").textContent = a.ritmo ? a.ritmo + " linhas/min" : "—";
  try { localStorage.setItem("ata-G" + GRUPO, JSON.stringify(a)); } catch (e) {}
}

/* ---------- telas ---------- */

function telaGrupo(g){
  const cfg = GRUPOS[g];
  GRUPO = g; TEM_IA = cfg.extra === "promptA" || cfg.extra === "promptB";
  const m = MODOS[cfg.modo];

  document.getElementById("topTag").textContent = "G" + g;
  document.getElementById("topModo").textContent = m.nome;
  document.getElementById("topClock").textContent = "PR #1 · 20 min";
  document.title = "G" + g + " · Campeonato de Revisão";

  let h = '<section style="margin-top:26px">';
  h += '<span class="eyebrow">Atividade prática · 15/09/2026</span>';
  h += "<h1>Grupo " + g + " — vocês são a revisão</h1>";
  h += '<p>O <strong>@dev.junior</strong> abriu o PR #1 implementando o <strong>RF-014 — Matrícula de aluno em turma de disciplina</strong>: ' +
       "<em>&ldquo;testes passando localmente (2/2 verdes), acho que dá pra fazer o merge hoje&rdquo;</em>. O pipeline está verde, " +
       "a pessoa que revisaria está de férias, e faltam duas semanas para o período de matrícula.</p>" +
       '<p class="note">Cada grupo recebeu um modo de revisão diferente e nenhum sabe qual é o do vizinho. ' +
       "Não troquem de modo, não &ldquo;melhorem&rdquo; o método no meio do caminho: a comparação no final é a aula.</p>";
  h += "</section>";
  h += blocoCartao(cfg.modo);
  if (cfg.extra === "checklist") h += blocoChecklist();
  if (cfg.extra === "promptA") h += blocoPrompt("A");
  if (cfg.extra === "promptB") h += blocoPrompt("B");
  h += blocoLinks();
  h += blocoAta(g, cfg);
  app.innerHTML = h;

  for (let i = 0; i < 5; i++) addDefeito();
  for (let i = 0; i < 2; i++) addFP();
  $("#maisDefeito").addEventListener("click", addDefeito);
  $("#maisFP").addEventListener("click", addFP);
  $("#imprimirAta").addEventListener("click", () => {
    document.body.classList.add("so-ata");
    window.print();
  });
  window.addEventListener("afterprint", () => document.body.classList.remove("so-ata"));
  const enviar = $("#enviarAta");
  if (enviar) enviar.addEventListener("click", () => {
    let destino = FORM_URL;
    if (FORM_CAMPO_GRUPO){
      destino += (destino.indexOf("?") >= 0 ? "&" : "?") +
                 "usp=pp_url&" + FORM_CAMPO_GRUPO + "=" + encodeURIComponent("G" + GRUPO);
    }
    window.open(destino, "_blank", "noopener");
  });
  $("#copiarAta").addEventListener("click", async () => {
    const status = $("#ataStatus");
    try {
      await navigator.clipboard.writeText(ataEmTexto(coletarAta()));
      status.textContent = "ata copiada — cole onde a professora pediu";
      status.className = "status ok";
    } catch (e) {
      status.textContent = "o navegador bloqueou a cópia — use o PDF";
      status.className = "status err";
    }
  });
  app.addEventListener("input", e => {
    crescer(e.target);
    recalcular();
  });

  const copiar = $("#copiarPrompt");
  if (copiar) copiar.addEventListener("click", async () => {
    const texto = cfg.extra === "promptA" ? PROMPT_A : PROMPT_B;
    try { await navigator.clipboard.writeText(texto); $("#copiaStatus").textContent = "copiado"; }
    catch (e) { $("#copiaStatus").textContent = "selecione o texto abaixo e copie à mão"; }
  });

  document.getElementById("voltar").hidden = false;

  let rascunho = null;
  try { rascunho = JSON.parse(localStorage.getItem("ata-G" + g) || "null"); } catch (e) {}
  if (rascunho) aplicarAta(rascunho);
  recalcular();
  crescerTodas();
  recalcular();
}

/* ---------- exportação da ata ---------- */

function ataEmTexto(a){
  const L = [];
  L.push("ATA DE REVISAO - PR #1 (RF-014)");
  L.push("Grupo: " + a.grupo + "  |  Modo: " + a.modo + " - " + a.modoNome);
  L.push("Inicio: " + (a.inicio || "-") + "  Fim: " + (a.fim || "-") + "  Tempo efetivo: " + (a.tempo || "-") + " min");
  L.push("Artefatos: PR #1 (matricula.py, test_matricula.py) - referencia: docs/RF-014.md, CONTRIBUTING.md");
  L.push("");
  L.push("PAPEIS");
  a.papeis.forEach(p => { if (p.nome) L.push("  - " + p.papel + ": " + p.nome); });
  L.push("");
  L.push("DEFEITOS (" + a.totalAchados + ")");
  a.defeitos.forEach((d, i) => {
    L.push("  D-" + String(i + 1).padStart(2, "0") + " | " + d.arquivo + " | " + d.tipo + " | " + d.sev +
           (d.origem ? " | " + d.origem : "") + " | achado por " + (d.quem || "-"));
    L.push("       " + d.descricao);
  });
  L.push("");
  L.push("FALSOS POSITIVOS (" + a.totalDescartados + ")");
  a.falsosPositivos.forEach(f => L.push("  - " + f.achado + "  >> " + f.motivo));
  L.push("");
  L.push("NUMEROS PARA O QUADRO");
  L.push("  Achados registrados: " + a.totalAchados);
  L.push("  Descartados como falso positivo: " + a.totalDescartados);
  L.push("  Tempo efetivo: " + (a.tempo || "-") + " min");
  L.push("  Linhas por minuto (150 / tempo): " + (a.ritmo != null ? a.ritmo : "-"));
  L.push("");
  L.push("DECISAO: " + (a.decisao || "-"));
  L.push("Justificativa: " + (a.justificativa || "-"));
  L.push("");
  L.push("REFLEXAO");
  L.push("  a) Pegou bem: " + (a.reflexao.a || "-"));
  L.push("  b) Deixou passar: " + (a.reflexao.b || "-"));
  L.push("  c) Mudariamos: " + (a.reflexao.c || "-"));
  return L.join(String.fromCharCode(10));
}

  document.title = "Campeonato de Revisão";
  document.getElementById("voltar").hidden = true;
  document.getElementById("topTag").textContent = "SIGA · PR #1";
  document.getElementById("topModo").textContent = "Campeonato de Revisão";
  document.getElementById("topClock").textContent = "15/09/2026 · 20 min de revisão";
  const botoes = Object.keys(GRUPOS).map(g =>
    '<button class="btn ghost grupoBtn" type="button" data-g="' + g + '">Grupo ' + g + "</button>").join("");
  app.innerHTML =
    '<section style="margin-top:26px"><span class="eyebrow">Atividade prática · 15/09/2026</span>' +
    "<h1>Campeonato de Revisão</h1>" +
    "<p>Sete grupos, o mesmo Pull Request, sete modos de revisão diferentes. " +
    "No final, um quadro comparativo mostra o que cada modo pegou — e o que deixou passar.</p></section>" +
    '<section class="panelcard"><h2>Qual é o seu grupo?</h2>' +
    '<p class="note">Toque no número do seu grupo. Cada grupo vê apenas o próprio modo de revisão — ' +
    "entrar no grupo do vizinho estraga a comparação final para os dois.</p>" +
    '<div class="row" style="margin-top:14px">' + botoes + "</div>" +
    '<p class="note" style="margin-top:16px"><a href="' + PR_URL + '" target="_blank" rel="noopener">PR #1 → Files changed</a> — é ali que a revisão acontece.</p></section>';
  app.querySelectorAll(".grupoBtn").forEach(b =>
    b.addEventListener("click", () => telaGrupo(b.dataset.g)));
}

function telaPainel(){
  document.title = "Painel da squad · Campeonato de Revisão";
  document.getElementById("topTag").textContent = "SQUAD";
  document.getElementById("topModo").textContent = "Painel da atividade";
  let h = '<section class="noprint" style="margin-top:26px"><span class="eyebrow">Uso interno da squad</span>' +
    "<h1>Painel da atividade</h1>" +
    '<p class="note">Uma folha de QRs para recortar e distribuir — é o que substitui os cartões, o checklist e os envelopes de prompt. ' +
    "Não projete esta tela: ela revela o modo de cada grupo.</p>" +
    '<div class="row noprint" style="margin-top:12px"><button class="btn ghost" id="imprimirQR" type="button">Imprimir a folha de QRs</button></div></section>';

  h += '<section class="panelcard noprint"><div class="sec-head"><span class="eyebrow">Antes de imprimir</span></div>' +
       "<h2>Cole aqui o link público da página</h2>" +
       '<p class="note">Compartilhe esta página (menu de compartilhamento do artefato) e cole abaixo o link que os alunos vão abrir. ' +
       "Os QRs são gerados a partir dele — se o link estiver errado, os sete QRs estarão errados juntos.</p>" +
       '<label for="linkPublico">Link público</label><input id="linkPublico" spellcheck="false">' +
       '<p class="note">Teste um: abra <code>&lt;link&gt;?g=1</code> numa aba anônima. Se cair na tela de escolha de grupo em vez do cartão do G1, ' +
       "tudo bem — o aluno toca no número do grupo e chega no mesmo lugar.</p></section>";

  h += '<section class="folhaqr"><div class="sec-head noprint"><span class="eyebrow">Distribuição — recortar nas linhas tracejadas</span></div>' +
       '<div class="qrsheet" id="qrsheet"></div></section>';

  h += '<section class="panelcard noprint"><div class="sec-head"><span class="eyebrow">Como a squad recolhe</span></div>' +
       "<h2>A entrega continua sendo a ata</h2>" +
       '<p class="note">Cada grupo preenche a ata na própria página e entrega de um dos dois jeitos: ' +
       "<strong>Gerar a ata em PDF</strong> (sai só a ata, sem o cartão nem o checklist) ou " +
       "<strong>Copiar a ata como texto</strong>, para colar onde a professora pedir. " +
       "O rascunho fica guardado no navegador do grupo — trocar de aba não perde nada, fechar o navegador perde.</p>" +
       '<p class="note">O quadro comparativo segue no quadro branco, preenchido ao vivo pelo A5 conforme cada grupo reporta os quatro números: ' +
       "achados reais, falsos positivos, críticos e achado exclusivo.</p></section>";

  app.innerHTML = h;

  const campo = $("#linkPublico");
  let salvo = null;
  try { salvo = localStorage.getItem("link-publico"); } catch (e) {}
  campo.value = salvo || location.origin + location.pathname;
  desenharQRs(campo.value);
  campo.addEventListener("input", () => {
    try { localStorage.setItem("link-publico", campo.value.trim()); } catch (e) {}
    desenharQRs(campo.value.trim());
  });
  $("#imprimirQR").addEventListener("click", () => window.print());
}

function desenharQRs(base){
  const sheet = $("#qrsheet");
  sheet.innerHTML = "";
  const limpo = (base || "").split("?")[0].split("#")[0];
  Object.keys(GRUPOS).forEach(g => {
    const url = limpo + "?g=" + g;
    const cel = document.createElement("div");
    cel.className = "qrcell";
    cel.innerHTML = '<div class="g">Grupo ' + g + "</div>" +
      '<div class="note" style="font-size:.8rem;margin-bottom:8px">aponte a câmera</div>' +
      '<div class="qrbox"></div><div class="u">' + esc(url) + "</div>";
    sheet.appendChild(cel);
    if (window.QRCode){
      new QRCode(cel.querySelector(".qrbox"), {text: url, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M});
    }
  });
}

document.getElementById("voltar").addEventListener("click", () => {
  telaInicial();
  window.scrollTo(0, 0);
});

/* ---------- rota ---------- */

const hashG = (location.hash.match(/g=?(\d)/) || [])[1];
const g = params.get("g") || hashG;
if (params.get("painel") === "squad" || location.hash.indexOf("painel") >= 0) telaPainel();
else if (g && GRUPOS[g]) telaGrupo(g);
else telaInicial();
